<ul class="heroes">
  @for (hero of heroes(); track hero.id) {
    <li>
      <a [routerLink]="['/heroes', hero.id]">{{ hero.name }}</a>
      <button
        type="button"
        class="delete-button"
        [attr.aria-label]="'Delete ' + hero.name"
        (click)="delete(hero)"
      >
        Delete
      </button>
    </li>
  }
</ul>
